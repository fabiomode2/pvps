name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PVPS_KEYSTORE_FILE: keystore/release.jks
      PVPS_KEYSTORE_PASSWORD: ${{ secrets.PVPS_KEYSTORE_PASSWORD }}
      PVPS_KEY_ALIAS: ${{ secrets.PVPS_KEY_ALIAS }}
      PVPS_KEY_PASSWORD: ${{ secrets.PVPS_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate install script
        run: |
          bash -n install.sh
          shellcheck -S warning install.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          if command -v sdkmanager > /dev/null 2>&1; then
            SDKM="$(command -v sdkmanager)"
          else
            SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
            export ANDROID_HOME="${SDK}"
            export ANDROID_SDK_ROOT="${SDK}"
            echo "ANDROID_HOME=${SDK}" >> "${GITHUB_ENV}"
            echo "ANDROID_SDK_ROOT=${SDK}" >> "${GITHUB_ENV}"
            SDKM="$(find "${SDK}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
            if [[ -z "${SDKM}" ]]; then
              echo "::error::sdkmanager not found after setup-android"
              exit 1
            fi
            echo "Using ${SDKM}"
          fi
          yes | "${SDKM}" --licenses > /dev/null || true
          "${SDKM}" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Resolve version
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            release_tag="${GITHUB_REF_NAME}"
          else
            version="$(awk -F'"' '/pvpsVersionName.*\?: "/ {print $4; exit}' app/build.gradle.kts)"
            if [[ -z "${version}" ]]; then
              version="$(awk -F'"' '/versionName = "/ {print $2; exit}' app/build.gradle.kts)"
            fi
            version="${version:-0.0.0}-dev.${GITHUB_SHA::7}"
            release_tag="v${version}"
          fi
          if [[ -z "${version}" ]]; then
            echo "::error::Could not resolve a release version"
            exit 1
          fi
          core="${version%%-*}"
          core="${core%%+*}"
          IFS=. read -r major minor patch <<< "${core}"
          major="${major//[^0-9]/}"
          minor="${minor//[^0-9]/}"
          patch="${patch//[^0-9]/}"
          version_code=$((10#${major:-0} * 10000 + 10#${minor:-0} * 100 + 10#${patch:-0}))
          if (( version_code < 1 )); then
            version_code=1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${version_code}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Decode signing keystore
        env:
          PVPS_KEYSTORE_BASE64: ${{ secrets.PVPS_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${PVPS_KEYSTORE_BASE64}" ]]; then
            echo "::error::PVPS_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          if [[ -z "${PVPS_KEYSTORE_PASSWORD}" || -z "${PVPS_KEY_ALIAS}" || -z "${PVPS_KEY_PASSWORD}" ]]; then
            echo "::error::PVPS_KEYSTORE_PASSWORD, PVPS_KEY_ALIAS and PVPS_KEY_PASSWORD must be set"
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "${PVPS_KEYSTORE_BASE64}" | base64 -d > keystore/release.jks
          chmod 600 keystore/release.jks

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease \
            -PpvpsVersionName="${{ steps.meta.outputs.version }}" \
            -PpvpsVersionCode="${{ steps.meta.outputs.version_code }}"

      - name: Package release
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "${apk}" ]]; then
            echo "::error::APK not found at ${apk}"
            exit 1
          fi
          mkdir -p dist
          cp "${apk}" "dist/pvps-${{ steps.meta.outputs.version }}.apk"
          (cd dist && sha256sum "pvps-${{ steps.meta.outputs.version }}.apk" > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: pvps-${{ steps.meta.outputs.version }}
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: PVPS ${{ steps.meta.outputs.version }}
          prerelease: ${{ github.ref_type != 'tag' || contains(steps.meta.outputs.version, '-') }}
          body: |
            **Download:** `pvps-${{ steps.meta.outputs.version }}.apk` (Android 9+, arm64-v8a)

            **VPS setup (Ubuntu/Debian):**
            ```bash
            curl -fsSL https://github.com/fabiomode2/pvps/releases/latest/download/install.sh | bash
            ```

            **What's new in ${{ steps.meta.outputs.version }}:**
            - Photo quick menu: tap the clip and choose Photos or Files. Photos
              use the Android photo picker, with multi-select and thumbnails.
            - Full markdown rendering: headings, lists, quotes, links, tables
              and fenced code with a language label, copy button and light
              syntax colouring. User messages render markdown too.
            - One header button collapses every thinking block and tool call.
            - A floating "Latest" pill jumps to the bottom of long chats and
              only appears when you are reading older messages.
            - Questions now take over the chat one at a time, with progress,
              Back/Next, required-field validation and "Type your own answer"
              for option fields.
            - Images in messages render with downsampling and a full-screen
              viewer; outgoing photos show thumbnails in the composer.
            - Queue watchdog: queued prompts are re-checked after sending and
              promoted on idle, with a bounded queue status panel.
            - App-wide editorial polish: calmer cards, consistent section
              headers, softer dock and dashboard surfaces.
          files: |
            dist/pvps-${{ steps.meta.outputs.version }}.apk
            dist/SHA256SUMS
            install.sh
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
