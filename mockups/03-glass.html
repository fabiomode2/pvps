<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>03 · Soft glass</title>
<style>
:root{--ink:#1B1B2A;--muted:#6B6B7C;--accent:#5B5BD6;--accent2:#8B7CFF;--ok:#12A97E;--warn:#E8873A;
--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:#DDE3EC;padding:28px 16px 48px;display:flex;gap:26px;justify-content:center;flex-wrap:wrap;font-family:var(--sans);color:var(--ink)}
.name{width:100%;text-align:center;font:700 12px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#4c5464;margin-bottom:4px}
.device{width:390px;height:844px;border-radius:52px;background:#F2F4F8;overflow:hidden;position:relative;box-shadow:0 40px 80px rgba(30,40,80,.25),0 0 0 10px #0d0f14}
.screen{height:100%;overflow:auto;padding:0 20px 108px;position:relative}
.mesh{position:sticky;top:0;height:0}
.bg{position:absolute;inset:0;z-index:-1;background:
 radial-gradient(120% 80% at 12% 0%,#FFE3D3 0%,rgba(255,227,211,0) 55%),
 radial-gradient(100% 70% at 100% 8%,#DCD5FF 0%,rgba(220,213,255,0) 58%),
 radial-gradient(90% 60% at 50% 100%,#CFF3E5 0%,rgba(207,243,229,0) 60%),
 linear-gradient(180deg,#F5F6FA,#E9EDF6 60%,#F3F1FA)}
.statusbar{display:flex;justify-content:space-between;font:600 13px var(--sans);padding:14px 6px 6px;color:#22233a}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 6px}
.brand{font:700 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:#6a6f85}
.icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(18px);color:#3b3f55;font-size:15px;box-shadow:0 6px 18px rgba(60,70,110,.10)}
h1{font:700 34px/1.08 var(--sans);letter-spacing:-.026em;margin:18px 0 6px}
.sub{font:500 12.5px var(--mono);color:var(--muted);display:flex;align-items:center;gap:8px}
.sub i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(18,169,126,.16);display:block}
.glass{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.85);backdrop-filter:blur(24px);border-radius:28px;box-shadow:0 18px 40px rgba(50,60,100,.10);padding:18px}
.hero{margin-top:18px;display:flex;align-items:center;gap:16px}
.ring{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) 0 62%,rgba(91,91,214,.16) 62% 100%);position:relative;flex:0 0 auto}
.ring:after{content:"";position:absolute;inset:6px;border-radius:50%;background:rgba(255,255,255,.92)}
.ring b{position:relative;font:700 15px var(--sans);color:var(--accent)}
.hero .txt{flex:1}
.hero .txt .t{font:600 15px var(--sans)}
.hero .txt .d{font:400 12px var(--sans);color:var(--muted);margin-top:2px;line-height:1.4}
.actions{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border:0;border-radius:18px;padding:15px 16px;font:600 14px var(--sans);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 12px 26px rgba(91,91,214,.34)}
.btn.ghost{flex:0 0 56px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);color:#4a4f66}
h2{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#6c7288;margin:26px 4px 10px;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{padding:16px}
.tile .k{font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#6c7288}
.tile .v{font:700 32px/1 var(--sans);letter-spacing:-.03em;margin:8px 0 2px}
.tile .v small{font:600 12px var(--sans);color:var(--muted);letter-spacing:0}
.tile .d{font:400 10.5px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;border-radius:99px;background:rgba(20,25,60,.08);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7C7CF0,#9E8BFF)}
.list{padding:4px}
.item{display:flex;align-items:center;gap:14px;padding:14px 12px;border-radius:20px;cursor:pointer}
.item:active{background:rgba(255,255,255,.5)}
.glyph{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:17px;background:rgba(91,91,214,.12);color:var(--accent)}
.item .t{flex:1}
.item .t b{font:600 14.5px var(--sans);display:block}
.item .t span{font:400 11.5px var(--sans);color:var(--muted)}
.item .v{font:600 12px var(--mono);color:var(--muted)}
.item .v.warn{color:var(--warn)}
.foot{font:400 10.5px var(--mono);color:#7b8095;line-height:1.7;margin:16px 6px 0}
.dock{position:absolute;left:16px;right:16px;bottom:16px;height:64px;border-radius:32px;background:rgba(255,255,255,.72);backdrop-filter:blur(26px);border:1px solid rgba(255,255,255,.9);box-shadow:0 18px 40px rgba(40,50,90,.16);display:flex;align-items:center;padding:6px}
.dock a{flex:1;text-align:center;text-decoration:none;color:#7c8198;font:600 9.5px var(--sans);letter-spacing:.02em;padding:8px 0;border-radius:24px}
.dock a b{display:block;font-size:16px;margin-bottom:2px;font-weight:500}
.dock a.on{background:#fff;color:var(--accent);box-shadow:0 8px 18px rgba(60,70,120,.14)}
/* chat */
.msgs{padding-top:12px}
.bub{max-width:88%;padding:13px 16px;border-radius:22px;font:400 14.5px/1.5 var(--sans);margin:8px 0}
.bub.ai{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);border-bottom-left-radius:6px;backdrop-filter:blur(20px)}
.bub.me{margin-left:auto;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-bottom-right-radius:6px;box-shadow:0 10px 22px rgba(91,91,214,.28)}
.code{margin:10px 0 4px;padding:12px 14px;border-radius:16px;background:rgba(25,27,45,.92);color:#cfe3ff;font:400 11px/1.65 var(--mono);white-space:pre-wrap}
.composer{position:absolute;left:16px;right:16px;bottom:16px}
.composer .box{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.8);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.95);border-radius:28px;padding:8px 8px 8px 18px;box-shadow:0 16px 34px rgba(40,50,90,.16)}
.composer input{flex:1;border:0;background:transparent;font:400 14.5px var(--sans);outline:none;color:var(--ink)}
.composer button{width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:17px;box-shadow:0 8px 18px rgba(91,91,214,.34)}
</style></head>
<body>
<div class="name">03 · Soft glass — luz, desenfoque, redondeado</div>

<figure class="device" style="margin:0">
  <div class="screen">
    <div class="bg"></div>
    <div class="statusbar"><span>21:07</span><span>5G ▪▪▪</span></div>
    <div class="top"><div class="brand">PVPS</div><div class="icon">＋</div></div>
    <h1>vps</h1>
    <div class="sub"><i></i> ubuntu@130.110.235.61</div>

    <div class="glass hero">
      <div class="ring"><b>62%</b></div>
      <div class="txt">
        <div class="t">Connected over SSH</div>
        <div class="d">Tunnel :43359 · OpenCode ready<br>3 sessions · 19.4k context</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn primary">Conversation →</button>
      <button class="btn ghost">⏻</button>
    </div>

    <h2>Telemetry <span>now</span></h2>
    <div class="grid">
      <div class="glass tile"><div class="k">CPU</div><div class="v">4<small>%</small></div><div class="d">load 0.08 · 2 cores</div><div class="bar"><i style="width:4%"></i></div></div>
      <div class="glass tile"><div class="k">RAM</div><div class="v">41<small>%</small></div><div class="d">4.9 / 11.6 GB</div><div class="bar"><i style="width:41%"></i></div></div>
      <div class="glass tile"><div class="k">Disk</div><div class="v">51<small>%</small></div><div class="d">96.5 / 193 GB</div><div class="bar"><i style="width:51%"></i></div></div>
      <div class="glass tile"><div class="k">Docker</div><div class="v">19<small>/19</small></div><div class="d">running</div><div class="bar"><i style="width:100%"></i></div></div>
    </div>

    <h2>Control</h2>
    <div class="glass list">
      <div class="item"><div class="glyph">▤</div><div class="t"><b>Services</b><span>systemd units</span></div><div class="v warn">2 failed</div></div>
      <div class="item"><div class="glyph">◉</div><div class="t"><b>Processes</b><span>cpu · memory</span></div><div class="v">›</div></div>
      <div class="item"><div class="glyph">⌂</div><div class="t"><b>Hosts</b><span>ssh targets</span></div><div class="v">2</div></div>
    </div>
    <div class="foot">Ubuntu 24.04.5 LTS · 6.17.0‑1020‑oracle<br>up 6 weeks, 6 days · tailscale 100.102.169.49</div>
  </div>
  <div class="dock"><a class="on" href="#"><b>⌂</b>Home</a><a href="#"><b>◌</b>Chat</a><a href="#"><b>▤</b>Files</a><a href="#"><b>▦</b>Shell</a><a href="#"><b>⋯</b>More</a></div>
</figure>

<figure class="device" style="margin:0">
  <div class="screen" style="padding-bottom:0">
    <div class="bg"></div>
    <div class="statusbar"><span>21:07</span><span>5G ▪▪▪</span></div>
    <div class="top"><div class="brand">← vps · ready</div><div class="icon">⋯</div></div>
    <div class="msgs">
      <div class="bub me">mira los logs de nginx y dime si hay algo raro con el 502 de esta mañana</div>
      <div class="bub ai">Revisé access.log y error.log. El 502 es un upstream timeout: nginx espera 60s y el contenedor tarda 74s.
        <div class="code">upstream timed out (110)
"GET /api/chat" 502</div>
        Subí proxy_read_timeout a 120s y recargué nginx. Ya responde 200.</div>
    </div>
    <div class="composer"><div class="box"><input placeholder="Message OpenCode…"><button>↑</button></div></div>
  </div>
</figure>
</body></html>
